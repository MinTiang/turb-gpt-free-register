# 构建镜像并推送到 GHCR(ghcr.io/mintiang/turb-gpt-free-register)
# 触发:仅 v* 开头的标签提交(v0.0.1 等);workflow_dispatch 可手动触发。
# amd64 / arm64 两个 job 并行构建(按 digest 直推),最后 merge job 把两个
# 平台合成同一个多架构 manifest:latest + v* 版本号,pull 时自动选架构。
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR 镜像名必须全小写,这里硬编码避免 github.repository 大小写问题
  IMAGE: ghcr.io/mintiang/turb-gpt-free-register

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # arm64 用 QEMU 模拟构建
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 按 digest 直推(不占用标签),标签由 merge job 统一打
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合成多架构 manifest(两个平台 → latest + 版本号)
        working-directory: /tmp/digests
        run: |
          TAGS="-t ${IMAGE}:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS -t ${IMAGE}:${{ github.ref_name }}"
          fi
          docker buildx imagetools create $TAGS \
            $(printf "${IMAGE}@sha256:%s " *)
