# 构建镜像并推送到 GHCR(ghcr.io/mintiang/turb-gpt-free-register)
# 触发:仅 v* 开头的标签提交(v0.0.1 等);workflow_dispatch 可手动触发。
# amd64 / arm64 两个 job 并行,各自直接推送平台专属标签:
#   v0.0.1-amd64 / latest-amd64 / v0.0.1-arm64 / latest-arm64
# 部署时按机器架构拉对应标签(compose 默认 latest-amd64)。
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR 镜像名必须全小写,这里硬编码避免 github.repository 大小写问题
  IMAGE: ghcr.io/mintiang/turb-gpt-free-register

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # arm64 用 QEMU 模拟构建
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规则:tag 触发 → v0.0.1-amd64 + latest-amd64;手动触发 → latest-amd64
      - id: tags
        run: |
          VER="latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then VER="${{ github.ref_name }}"; fi
          {
            echo "${IMAGE}:${VER}-${{ matrix.arch }}"
            echo "${IMAGE}:latest-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
