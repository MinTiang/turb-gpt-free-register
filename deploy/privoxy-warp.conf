listen-address  0.0.0.0:8118
toggle  1
enable-remote-toggle  0
enable-remote-http-toggle  0
enable-edit-actions  0
enforce-blocks  0
buffer-limit  4096
keep-alive-timeout  300
socket-timeout  300

# 宿主机上的 WARP 容器把 SOCKS 映射在 40000。
# host.docker.internal 在这个 Docker Desktop 里解析成 IPv6，privoxy 连不上；
# 容器默认网关 192.168.65.254 的 40000 可以到达。
forward-socks5t / 192.168.65.254:40000 .
