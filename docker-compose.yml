# turb-gpt-free-register 部署编排。详细说明与 .env 需要改的项见 docs/DEPLOY_DOCKER.md。
#
# 快速开始:
#   docker compose up -d          # 镜像不存在时自动本地构建
#   docker compose logs -f
#   docker compose pull && docker compose up -d   # 拉取 GHCR 最新镜像更新
services:
  turb-webui:
    # latest 为多架构 manifest,pull 时自动选 amd64/arm64
    image: ghcr.io/mintiang/turb-gpt-free-register:latest
    build:
      context: .
      # 国内网络构建 apt 慢/502 时:APT_MIRROR=mirrors.tuna.tsinghua.edu.cn docker compose build
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    container_name: turb-webui
    restart: unless-stopped
    # init: 用 tini 作 PID 1, 自动回收僵尸子进程(浏览器/工具子进程退出后不留僵尸)
    init: true
    # 硬上限: 即使出现内存/进程泄漏, 最坏 OOM 重启本容器, 不会拖死宿主机
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${WEBUI_PORT:-5000}:5000"
    volumes:
      # 配置文件:WebUI 配置页会写回,不要加 :ro
      - ./.env:/app/.env
      # 运行态全部落卷(turb.sqlite3 经镜像内符号链接落到 app-state 卷)
      - app-state:/app/state
      - app-data:/app/data
      - app-logs:/app/logs
      - app-reglogs:/app/注册日志
      # cloakbrowser 二进制缓存(首跑下载,数百 MB,持久化避免重复下载)
      - app-cloak:/home/app/.cloakbrowser
      # playwright 浏览器二进制(CloakBrowser 依赖,首启检测为空才下载)
      - app-pw:/opt/ms-playwright
    # 容器内访问宿主机本地代理(如 7897):.env 里把 PROXY_POOL 的
    # 127.0.0.1 改成 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  app-state:
  app-data:
  app-logs:
  app-reglogs:
  app-cloak:
  app-pw:
